{% extends "tickets/base.html" %}
{% block title %}{{ article.title }} - AI Helpdesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card ticket-card p-4">
      <span class="badge bg-secondary mb-2" style="width:fit-content">{{ article.category }}</span>
      <h3>{{ article.title }}</h3>
      <p class="text-muted">{{ article.summary }}</p>
      <hr>
      <div>{{ article.content|linebreaks }}</div>
      <a href="{% url 'kb_list' %}" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Back to Knowledge Base</a>
    </div>
  </div>
</div>
{% endblock %}
